<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tokens Figma</title>
  <link rel="stylesheet" href="css/variables.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-families-body), sans-serif;
      font-size: var(--font-sizes-body);
      background: var(--bg-default);
      color: var(--fg-default);
      min-height: 100vh;
      padding: var(--spacing-xl);
      line-height: var(--line-heights-body);
    }

    .page {
      max-width: 480px;
      margin: 0 auto;
    }

    h1 {
      font-family: var(--font-families-heading), sans-serif;
      font-size: var(--font-sizes-h2);
      font-weight: var(--font-weights-heading-bold);
      margin-bottom: var(--spacing-md);
    }

    p {
      color: var(--fg-muted);
      margin-bottom: var(--spacing-lg);
    }

    .btn {
      display: inline-block;
      padding: var(--spacing-sm) var(--spacing-lg);
      background: var(--button-primary-background);
      color: var(--button-primary-text);
      border: none;
      border-radius: var(--button-border-radius);
      font-family: inherit;
      font-size: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .card {
      margin-top: var(--spacing-xl);
      padding: var(--card-padding);
      background: var(--card-background);
      border-radius: var(--card-border-radius);
      box-shadow: var(--box-shadow-default);
    }

    .card p {
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>Tokens desde Figma</h1>
    <p>Página simple usando los tokens de tokensfigma/. Cambia los tokens en Figma, haz push, y la web se actualiza.</p>
    <button class="btn">Botón</button>
    <div class="card">
      <p>Tarjeta con tokens de card (background, padding, border-radius, box-shadow).</p>
    </div>
  </div>
</body>
</html>
